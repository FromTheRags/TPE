name: Release

on:
  push:
    tags:
      - 'v*'
      - '-v*'
      - '!*beta*'
      - '!*-beta*'

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (SDL 1.2 & Qt)
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl1.2-dev libsdl-ttf2.0-dev qtbase5-dev qttools5-dev-tools cmake ninja-build build-essential || \
          sudo apt-get install -y libsdl1.2-compat-dev libsdl-ttf2.0-dev qt6-base-dev qt6-tools-dev cmake ninja-build build-essential

      - name: Configure CMake
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build project
        run: cmake --build build --config Release

      - name: Package Linux Artifact
        run: |
          mkdir -p dist/tpe-linux
          cp build/tpe dist/tpe-linux/
          cp -r images assets dist/tpe-linux/
          if [ -d "examples" ]; then cp -r examples dist/tpe-linux/; fi
          cp LICENSE OFL.txt README.md dist/tpe-linux/
          cd dist && tar -czvf ../tpe-linux-x86_64.tar.gz tpe-linux

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: tpe-linux-x86_64.tar.gz

  build-windows:
    name: Build Windows Package & Installer
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSYS2 MinGW-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-SDL
            mingw-w64-x86_64-SDL_ttf
            mingw-w64-x86_64-qt5-base
            mingw-w64-x86_64-qt5-tools

      - name: Configure CMake
        shell: msys2 {0}
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build project
        shell: msys2 {0}
        run: cmake --build build --config Release

      - name: Package Windows Portable Zip
        shell: msys2 {0}
        run: |
          mkdir -p dist/tpe-windows
          cp build/tpe.exe dist/tpe-windows/
          cp -r images assets dist/tpe-windows/
          if [ -d "examples" ]; then cp -r examples dist/tpe-windows/; fi
          cp LICENSE OFL.txt README.md dist/tpe-windows/
          # Deploy Qt dependencies using windeployqt
          windeployqt --no-translations dist/tpe-windows/tpe.exe || true
          # Copy MinGW and SDL runtime DLLs
          cp /mingw64/bin/SDL.dll dist/tpe-windows/ 2>/dev/null || true
          cp /mingw64/bin/SDL_ttf.dll dist/tpe-windows/ 2>/dev/null || true
          cp /mingw64/bin/libgcc_s_seh-1.dll dist/tpe-windows/ 2>/dev/null || true
          cp /mingw64/bin/libstdc++-6.dll dist/tpe-windows/ 2>/dev/null || true
          cp /mingw64/bin/libwinpthread-1.dll dist/tpe-windows/ 2>/dev/null || true
          cd dist && cmake -E tar cf ../tpe-windows-x64.zip --format=zip tpe-windows

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command iscc.exe -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe") -and -not (Test-Path "${env:LOCALAPPDATA}\Programs\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress
          }

      - name: Build Inno Setup Installer
        shell: pwsh
        run: |
          $iscc = Get-Command iscc.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source
          if (-not $iscc -or -not (Test-Path $iscc)) {
            $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          }
          if (-not (Test-Path $iscc)) {
            $iscc = Join-Path ${env:ProgramFiles} 'Inno Setup 6\ISCC.exe'
          }
          if (-not (Test-Path $iscc)) {
            $iscc = Join-Path ${env:LOCALAPPDATA} 'Programs\Inno Setup 6\ISCC.exe'
          }
          & $iscc 'innosetup/tpe_setup.iss'

      - name: Upload Windows Portable Zip
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-zip
          path: tpe-windows-x64.zip

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-installer
          path: dist/tpe-setup-*.exe

  publish-release:
    name: Create GitHub Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Linux Package
        uses: actions/download-artifact@v4
        with:
          name: release-linux
          path: release-assets

      - name: Download Windows Portable Zip
        uses: actions/download-artifact@v4
        with:
          name: release-windows-zip
          path: release-assets

      - name: Download Windows Installer
        uses: actions/download-artifact@v4
        with:
          name: release-windows-installer
          path: release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
